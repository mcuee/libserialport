name: Build and Package libserialport

on:
  push:
    branches:
      - '**'        # Matches every branch push
  pull_request:
    branches:
      - '**'        # Matches every pull request target branch
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.arch || 'default' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux Build
          - os: ubuntu-latest
            artifact-name: libserialport-ubuntu

          # macOS Build
          - os: macos-latest
            artifact-name: libserialport-macos

          # Windows MSVC Matrix (x64, x86, ARM64)
          - os: windows-latest
            arch: x64
            artifact-name: libserialport-windows-x64
          - os: windows-latest
            arch: Win32
            artifact-name: libserialport-windows-x86
          - os: windows-latest
            arch: ARM64
            artifact-name: libserialport-windows-arm64

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev pkg-config

    - name: Configure Shared Library Build (Windows MSVC)
      if: matrix.os == 'windows-latest'
      run: |
        cmake -B build-shared `
          -A ${{ matrix.arch }} `
          -DBUILD_SHARED_LIBS=ON `
          -DCMAKE_INSTALL_PREFIX=stage

    - name: Configure Shared Library Build (Unix-like)
      if: matrix.os != 'windows-latest'
      run: |
        cmake -B build-shared \
          -DBUILD_SHARED_LIBS=ON \
          -DCMAKE_INSTALL_PREFIX=stage

    - name: Build Shared Variant
      run: cmake --build build-shared --config Release

    - name: Stage Shared Variant Artifacts
      run: cmake --install build-shared --config Release

    # Secondary compilation pass to explicitly capture static archives (.a / .lib)
    - name: Configure Static Library Build
      run: |
        cmake -B build-static \
          ${{ matrix.os == 'windows-latest' && format('-A {0}', matrix.arch) || '' }} \
          -DBUILD_SHARED_LIBS=OFF \
          -DCMAKE_INSTALL_PREFIX=stage

    - name: Build Static Variant
      run: cmake --build build-static --config Release

    - name: Stage Static Variant Artifacts
      run: cmake --install build-static --config Release

    - name: Upload Complete Artifact Package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: stage/
