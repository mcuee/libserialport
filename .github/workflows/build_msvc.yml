name: MSVC Build All Archs

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # x64_x86: Cross-compile x86 from x64 host
        # x64:     Native x64 build
        # x64_arm64: Cross-compile arm64 from x64 host
        include:
          - arch: x86
            vcvars_arg: x64_x86
          - arch: x64
            vcvars_arg: x64
          - arch: arm64
            vcvars_arg: x64_arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build with MSVC
        shell: cmd
        run: |
          :: Use the common variable to find vcvarsall.bat regardless of exact version
          call "%VS170COMNTOOLS%..\..\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars_arg }}
          
          :: Configure with CMake
          cmake -B build -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_SHARED_LIBS=ON ^
            -DLIBSERIALPORT_BUILD_EXAMPLES=ON ^
            -DLIBSERIALPORT_MSBUILD=1
            
          :: Build the project
          cmake --build build --config Release
