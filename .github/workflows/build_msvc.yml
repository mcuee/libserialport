name: MSVC Build All Archs

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86, platform: Win32 }
          - { arch: x64, platform: x64 }
          - { arch: arm64, platform: ARM64 }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Configure and Build
        run: |
          # Configure for Shared Library
          cmake -B build-shared -A ${{ matrix.platform }} -DBUILD_SHARED_LIBS=ON -DLIBSERIALPORT_BUILD_EXAMPLES=OFF
          cmake --build build-shared --config Release
          
          # Configure for Static Library
          cmake -B build-static -A ${{ matrix.platform }} -DBUILD_SHARED_LIBS=OFF -DLIBSERIALPORT_BUILD_EXAMPLES=OFF
          cmake --build build-static --config Release

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libserialport-${{ matrix.arch }}
          path: |
            build-shared/Release/*.dll
            build-shared/Release/*.lib
            build-static/Release/*.lib
